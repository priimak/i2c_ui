[project]
name = "i2cdgui"
version = "0.1.0"
description = "GUI for I2CDriver"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "usb-monitor",
    "i2cdriver==1.0.6",
    "pyside6==6.11.1",
    "pytide6 @ git+https://github.com/priimak/PyTide6.git@v0.16.0",
    "i2c-api @ git+https://github.com/priimak/i2c_api.git@v0.7.1",
    "rgscore @ git+https://github.com/priimak/rgscore.git@v0.7.0",
    "i2capi_i2cdriver @ git+https://github.com/priimak/i2capi_i2cdriver.git@v0.3.1"
]

[build-system]
requires = ["setuptools", "wheel", "setuptools-git-versioning"]
build-backend = "setuptools.build_meta"

[tool.setuptools-git-versioning]
enabled = true

[tool.setuptools.packages.find]
where = ["src"]

